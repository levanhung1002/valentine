<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>valentine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<audio autoplay loop>
    <source src="./music.mp3" type="audio/mpeg">
    Trình duyệt của bạn không hỗ trợ thẻ audio.
</audio>
<div class="center" id="pg1">
    <img src="https://p16-va.lemon8cdn.com/tos-alisg-v-a3e477-sg/oERAEDJFlIA7EbAAg97P0JQNhIafDfOEgTRNpe~tplv-tej9nj120t-origin.webp"
         alt="silly cat">
    <h1 class="header">
        Có muốn nhận lời chúc va lung tung hem?
    </h1>
    <div class="block">
        <div id="yes">
            <button class="yes" onclick="sayHello()">Muốn</button>
        </div>
        <div id="no">
            <button class="no" id="runaway-btn">Khum</button>
        </div>
    </div>
</div>

<div class="center" id="pg2" style="display: none">
    <img src="https://imgcdn.sigstick.com/z3nd1BUGFMqoK0jFSLvR/15-1.png" alt="cat"
         style="width: 300px; margin: 40px; height: auto;">
    <h1 style="padding: 5px; text-align: center">
        Chúc Valentine của lúp pi nhiều niềm vui nhó. Lại thêm 1 valentine nữa thêm iu nhao nhìu hơn he. Love u nhoa 🥰
    </h1>
</div>
<script>
    // Định nghĩa hàm sayHello
    function sayHello() {
        document.getElementById("pg1").style.display = 'none';
        document.getElementById("pg2").style.display = "flex";
        const audio = document.querySelector("audio");
        if (audio.paused === true) {
            audio.play();
        }
    }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.0/anime.min.js"></script>
<script src="script.js"></script>
</body>
</html>
